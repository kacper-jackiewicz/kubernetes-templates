apiVersion: v1
data:
  java_opts: "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED"
kind: ConfigMap
metadata:
  name: java-opts
---
apiVersion: v1
data:
  application.yaml: |
    spring.application.name: object-storage-loader
    
    storage:
      url: "http://minio.argo.svc.cluster.local:9000"
      user: admin
      password: password
      bucket:
        name: test
    
    tasks:
      download-objects:
        - from: "/work/bbb.json"
          to: "/work/consumer/input/trade.json"
      upload-objects:
        - from: "/work/mapper/output/output_${output}.json"
          to: "/work/output_20250125.json"

kind: ConfigMap
metadata:
  name: eq-sd-loader-config
---
apiVersion: v1
data:
  application.yaml: |
    spring.application.name: spark-mapper
    output.date: "${OUTPUT_DATE}"
    
    app:
      additional-field: "mapper-field"
      input: "/work/eq-sd-consumer/output/output_${output.date}.json"
      output: "/work/eq-sd-mapper/output/output_${output.date}.json"
kind: ConfigMap
metadata:
  name: eq-sd-mapper-config
---
apiVersion: v1
data:
  application.yaml: |
    spring.application.name: spark-consumer
    output.date: "${OUTPUT_DATE}"
    
    app:
      additional-field: "consumer-field"
      input: "/work/eq-sd-consumer/input/trade.json"
      output: "/work/eq-sd-consumer/output/output_${output.date}.json"
kind: ConfigMap
metadata:
  name: eq-sd-consumer-config
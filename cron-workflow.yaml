apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eq-sd-cron
spec:
  schedule: "*/3 * * * *"
  concurrencyPolicy: "Replace"
  startingDeadlineSeconds: 0
  workflowSpec:
    entrypoint: load-data
    arguments:
      parameters:
          - name: output_date
            value: "{{ workflow.creationTimestamp.%Y%m%d }}"
    templates:
      - name: load-data
        dag:
          tasks:
            - name: data-downloader
              template: data-downloader-template
            - name: mapper
              dependencies: [ data-downloader ]
              template: mapper-template
            - name: data-uploader
              template: data-uploader-template
              dependencies: [ mapper ]

      - name: data-downloader-template
        container:
          image: com.jk/object-storage-loader
          imagePullPolicy: Never
          command: [ "java","-Dspring.profiles.active=download", "-Dspring.config.location=file:/spring/config/application.yaml", "-jar","/app.jar" ]
          volumeMounts:
            - mountPath: /work
              name: data-volume
            - name: config-volume
              mountPath: /spring/config
        volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: eq-sd-pvc
          - name: config-volume
            configMap:
              name: eq-sd-loader-config
      - name: mapper-template
        container:
          image: com.jk/spark-mapper
          imagePullPolicy: Never
          env:
            - name: JDK_JAVA_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: java-opts
                  key: java_opts
          command: [ "java", "-Dspring.config.location=file:/spring/config/application.yaml", "-jar","/app.jar" ]
          volumeMounts:
            - name: config-volume
              mountPath: /spring/config
            - mountPath: /work
              name: data-volume
        volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: eq-sd-pvc
          - name: config-volume
            configMap:
              name: eq-sd-mapper-config
      - name: data-uploader-template
        container:
          image: com.jk/object-storage-loader
          imagePullPolicy: Never
          command: [ "java","-Dspring.profiles.active=upload", "-Dspring.config.location=file:/spring/config/application.yaml", "-jar","/app.jar" ]
          volumeMounts:
            - mountPath: /work
              name: data-volume
            - name: config-volume
              mountPath: /spring/config
        volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: eq-sd-pvc
          - name: config-volume
            configMap:
              name: eq-sd-loader-config